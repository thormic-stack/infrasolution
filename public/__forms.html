<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Source — Forms</title>
</head>
<body>
  <!-- Netlify Forms build-time detection skeleton -->
  <form name="sourcing-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="sourcing-inquiry" />
    <input name="bot-field" />
    <input name="productName" />
    <input name="name" />
    <input name="contact" />
    <input name="city" />
    <input name="paymentPreference" />
    <textarea name="message"></textarea>
  </form>

  <form name="general-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="general-inquiry" />
    <input name="bot-field" />
    <input name="name" />
    <input name="contact" />
    <input name="city" />
    <input name="serviceArea" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
